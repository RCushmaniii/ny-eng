name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # A superseded push should stop costing money. Without this, pushing twice to
  # an open PR leaves the first run burning minutes to completion for a commit
  # nobody is waiting on any more.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Default is 360 minutes. One hung job would eat a fifth of the
    # monthly allowance before anyone noticed.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint (TypeScript & React)
        run: npx eslint "src/**/*.{ts,tsx}" 2>&1 || echo "::warning::Lint found issues — see output above"

      - name: Type check
        run: npx astro check --minimumSeverity warning 2>&1 || true

      - name: Build (includes sitemap validation)
        run: npm run build
